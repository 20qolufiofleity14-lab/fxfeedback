<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#05060a"/><stop offset=".62" stop-color="#140b22"/><stop offset="1" stop-color="#2a0d33"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="glow2" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="floor"><rect x="0" y="330" width="512" height="182"/></clipPath>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- perspective grid floor -->
  <g clip-path="url(#floor)" stroke="#ff2bd6" stroke-opacity=".55" stroke-width="2">
    <line x1="0" y1="340" x2="512" y2="340"/><line x1="0" y1="362" x2="512" y2="362"/><line x1="0" y1="392" x2="512" y2="392"/><line x1="0" y1="432" x2="512" y2="432"/><line x1="0" y1="486" x2="512" y2="486"/>
    <line x1="256" y1="330" x2="256" y2="512"/><line x1="256" y1="330" x2="150" y2="512"/><line x1="256" y1="330" x2="362" y2="512"/>
    <line x1="256" y1="330" x2="40" y2="512"/><line x1="256" y1="330" x2="472" y2="512"/><line x1="256" y1="330" x2="-80" y2="512"/><line x1="256" y1="330" x2="592" y2="512"/>
  </g>
  <!-- sun stripes -->
  <g opacity=".22"><circle cx="256" cy="330" r="150" fill="#ff2bd6"/></g>
  <rect x="0" y="328" width="512" height="4" fill="#ff2bd6" opacity=".8"/>
  <!-- HUD brackets -->
  <g stroke="#3ef0ff" stroke-width="6" fill="none" opacity=".85" filter="url(#glow2)">
    <path d="M70 120 V70 H120"/><path d="M442 120 V70 H392"/><path d="M70 392 V442 H120"/><path d="M442 392 V442 H392"/>
  </g>
  <!-- glitch C : cyan / magenta offsets + gold core -->
  <g fill="none" stroke-linecap="square" stroke-width="54">
    <path d="M338 168 A110 110 0 1 0 338 344" stroke="#3ef0ff" transform="translate(-9,-4)" opacity=".9"/>
    <path d="M338 168 A110 110 0 1 0 338 344" stroke="#ff2bd6" transform="translate(9,4)" opacity=".9"/>
    <path d="M338 168 A110 110 0 1 0 338 344" stroke="#e9b949" filter="url(#glow)"/>
  </g>
  <!-- glitch slices -->
  <rect x="120" y="226" width="150" height="10" fill="#05060a"/>
  <rect x="150" y="226" width="60" height="10" fill="#3ef0ff" opacity=".8" transform="translate(18,0)"/>
  <rect x="100" y="290" width="120" height="7" fill="#05060a"/>
  <!-- gold dot -->
  <rect x="396" y="316" width="36" height="36" fill="#e9b949" filter="url(#glow)"/>
  <!-- crosshair -->
  <g stroke="#3ef0ff" stroke-width="4" opacity=".9"><line x1="232" y1="256" x2="248" y2="256"/><line x1="264" y1="256" x2="280" y2="256"/><line x1="256" y1="232" x2="256" y2="248"/><line x1="256" y1="264" x2="256" y2="280"/></g>
  <!-- scanlines -->
  <g opacity=".08" fill="#fff">
    <rect y="100" width="512" height="2"/><rect y="180" width="512" height="2"/><rect y="260" width="512" height="2"/>
  </g>
</svg>
