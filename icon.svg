<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a1f66"/><stop offset=".55" stop-color="#1c0f3a"/><stop offset="1" stop-color="#0b0618"/>
    </linearGradient>
    <radialGradient id="glowbg" cx=".5" cy=".62" r=".55"><stop offset="0" stop-color="#ff2bd6" stop-opacity=".45"/><stop offset="1" stop-color="#ff2bd6" stop-opacity="0"/></radialGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".38"/><stop offset=".45" stop-color="#fff" stop-opacity=".06"/><stop offset=".46" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff1b8"/><stop offset=".35" stop-color="#f4c94f"/><stop offset="1" stop-color="#b9821a"/></linearGradient>
    <linearGradient id="goldside" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8a5a10"/><stop offset="1" stop-color="#4a2f06"/></linearGradient>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2b2350"/><stop offset="1" stop-color="#130d26"/></linearGradient>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000" flood-opacity=".55"/></filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6"/></filter>
    <clipPath id="floor"><rect x="0" y="360" width="512" height="152"/></clipPath>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#glowbg)"/>
  <g clip-path="url(#floor)" stroke="#ff2bd6" stroke-opacity=".5" stroke-width="2.5">
    <line x1="0" y1="372" x2="512" y2="372"/><line x1="0" y1="398" x2="512" y2="398"/><line x1="0" y1="434" x2="512" y2="434"/><line x1="0" y1="486" x2="512" y2="486"/>
    <line x1="256" y1="360" x2="256" y2="512"/><line x1="256" y1="360" x2="130" y2="512"/><line x1="256" y1="360" x2="382" y2="512"/><line x1="256" y1="360" x2="0" y2="512"/><line x1="256" y1="360" x2="512" y2="512"/>
  </g>
  <!-- floating plate (puffy) -->
  <g filter="url(#drop)">
    <rect x="96" y="92" width="320" height="300" rx="72" fill="url(#plate)"/>
    <rect x="96" y="92" width="320" height="300" rx="72" fill="none" stroke="#7a6cff" stroke-opacity=".55" stroke-width="3"/>
  </g>
  <rect x="99" y="95" width="314" height="150" rx="69" fill="url(#sheen)"/>
  <!-- HUD brackets on plate -->
  <g stroke="#3ef0ff" stroke-width="9" fill="none" stroke-linecap="round" opacity=".95">
    <path d="M132 150 V128 H156"/><path d="M380 150 V128 H356"/><path d="M132 334 V356 H156"/><path d="M380 334 V356 H356"/>
  </g>
  <!-- 3D C : extrusion + face -->
  <g fill="none" stroke-linecap="round" stroke-width="50">
    <path d="M318 176 A82 82 0 1 0 318 304" stroke="url(#goldside)" transform="translate(0,12)"/>
    <path d="M318 176 A82 82 0 1 0 318 304" stroke="#ff2bd6" opacity=".55" transform="translate(6,3)"/>
    <path d="M318 176 A82 82 0 1 0 318 304" stroke="#3ef0ff" opacity=".55" transform="translate(-6,-3)"/>
    <path d="M318 176 A82 82 0 1 0 318 304" stroke="url(#gold)"/>
  </g>
  <path d="M190 196 A72 72 0 0 1 300 168" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="8" stroke-linecap="round"/>
  <!-- gold dot, puffy -->
  <rect x="340" y="296" width="36" height="36" rx="9" fill="url(#goldside)" transform="translate(0,9)"/>
  <rect x="340" y="296" width="36" height="36" rx="9" fill="url(#gold)"/>
  <rect x="345" y="300" width="22" height="8" rx="4" fill="#fff" opacity=".55"/>
  <!-- crosshair -->
  <g stroke="#3ef0ff" stroke-width="4" stroke-linecap="round"><line x1="226" y1="240" x2="238" y2="240"/><line x1="250" y1="240" x2="262" y2="240"/><line x1="244" y1="222" x2="244" y2="234"/><line x1="244" y1="246" x2="244" y2="258"/></g>
</svg>
